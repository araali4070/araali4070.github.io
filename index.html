<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasneem Ara | Portfolio</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #14213d;
            color: white;
            text-align: center;
            padding: 40px 15px;
        }

        .avatar-ring {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 18px;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #48cae4, #0077b6 50%, #90e0ef);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.08),
                        0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #14213d;
            background: #14213d;
        }

        /* Shows initials if the GitHub photo fails to load */
        .avatar-ring.no-img::after {
            content: "TA";
            position: absolute;
            inset: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 4px solid #14213d;
            background: #1d2f57;
            color: white;
            font-size: 44px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .avatar-ring.no-img .avatar { visibility: hidden; }

        header h1 { margin: 0 0 8px; }
        header p { margin: 4px 0; }

        .semester {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 14px;
            border: 1px solid #8fa3c7;
            border-radius: 20px;
            font-size: 14px;
        }

        section {
            background: white;
            width: 90%;
            max-width: 850px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 { word-wrap: break-word; }
        h2 { color: #14213d; }
        a { color: #0077b6; }

        footer {
            text-align: center;
            padding: 20px;
        }

        @media screen and (max-width: 768px) {
            body { font-size: 14px; }
            section { width: 95%; padding: 15px; }
            header h1 { font-size: 24px; }
            .avatar-ring { width: 120px; height: 120px; }
            .avatar-ring.no-img::after { font-size: 34px; }
        }
    </style>
</head>
<body>

<header>
    <!-- Replace YOURUSERNAME with your GitHub username. Your GitHub profile photo loads automatically. -->
    <div class="avatar-ring">
        <img class="avatar" src="https://github.com/YOURUSERNAME.png"
             alt="Tasneem Ara profile picture"
             onerror="this.parentElement.classList.add('no-img')">
    </div>
    <h1>Tasneem Ara</h1>
    <p>Information Security Student | Future Cybersecurity Engineer</p>
    <span class="semester">Currently in Semester 3 (Fall 2026)</span>
</header>

<section>
    <h2>About
